server:
  port: 8089

spring:
  application:
    name: autopayments
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
    # search_path соединения — своя схема (создаётся в infra/postgres/init.sql)
    hikari:
      schema: autopayments
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: autopayments
    liquibase-schema: autopayments

clients:
  account:
    url: ${ACCOUNT_URL:http://localhost:8081}
  pricing:
    url: ${PRICING_URL:http://localhost:8082}
  payment:
    url: ${PAYMENT_URL:http://localhost:8083}
  biller:
    url: ${BILLER_URL:http://localhost:8087}

autopay:
  # Как часто планировщик ищет автоплатежи, у которых наступила дата
  interval: ${AUTOPAY_INTERVAL:30s}
  # День автоплатежа считаем по московскому времени
  zone: Europe/Moscow
