server:
  port: 8089

spring:
  application:
    name: autopayments
  # Тайм-ауты всех HTTP-клиентов по умолчанию: зависший сосед не держит поток бесконечно
  http:
    clients:
      connect-timeout: ${HTTP_CONNECT_TIMEOUT:1s}
      read-timeout: ${HTTP_READ_TIMEOUT:5s}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
    # search_path соединения — своя схема (создаётся в infra/postgres/init.sql)
    hikari:
      schema: autopayments
  # Redis: блокировки планировщиков (ShedLock), кэш
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis — только для кэша и блокировок, репозитории Spring Data на нём не нужны
      repositories:
        enabled: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: autopayments
    liquibase-schema: autopayments

clients:
  account:
    url: ${ACCOUNT_URL:http://localhost:8081}
  pricing:
    url: ${PRICING_URL:http://localhost:8082}
  payment:
    url: ${PAYMENT_URL:http://localhost:8083}
  biller:
    url: ${BILLER_URL:http://localhost:8087}

autopay:
  # Как часто планировщик ищет автоплатежи, у которых наступила дата
  interval: ${AUTOPAY_INTERVAL:30s}
  # Пауза после старта: даём соседним сервисам подняться
  initial-delay: 10s
  # День автоплатежа считаем по московскому времени

# Общая библиотека libs/platform
platform:
  time:
    zone: Europe/Moscow
