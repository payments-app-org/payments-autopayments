server:
  port: 8089

spring:
  application:
    name: autopayments
  # Тайм-ауты всех HTTP-клиентов по умолчанию: зависший сосед не держит поток бесконечно
  http:
    clients:
      connect-timeout: ${HTTP_CONNECT_TIMEOUT:1s}
      read-timeout: ${HTTP_READ_TIMEOUT:5s}
    # Соседи: тайм-ауты по группам HTTP-интерфейсов (client/*Api)
    serviceclient:
      account:
        base-url: ${ACCOUNT_URL:http://localhost:8081}
        connect-timeout: 1s
        read-timeout: 3s
      biller:
        base-url: ${BILLER_URL:http://localhost:8087}
        connect-timeout: 1s
        read-timeout: 5s
      pricing:
        base-url: ${PRICING_URL:http://localhost:8082}
        connect-timeout: 1s
        read-timeout: 3s
      # Сага платежа идёт внутри запроса (резерв, антифрод, процессинг) — ждём дольше
      payment:
        base-url: ${PAYMENT_URL:http://localhost:8083}
        connect-timeout: 1s
        read-timeout: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
    # search_path соединения — своя схема (создаётся в infra/postgres/init.sql)
    hikari:
      schema: autopayments
  # Redis: блокировки планировщиков платформы (ShedLock)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis недоступен — отказ за секунды (кэш идёт мимо, readiness — DOWN), а не ожидание по минуте
      connect-timeout: 1s
      timeout: 2s
      # Репозитории Spring Data на Redis не нужны
      repositories:
        enabled: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: autopayments
    liquibase-schema: autopayments

autopay:
  # Как часто планировщик ищет, что пора провести
  interval: ${AUTOPAY_INTERVAL:30s}
  # Пауза после старта: даём соседним сервисам подняться
  initial-delay: 10s
  # Сколько записей под забирает за проход, сколько проводит одновременно и на сколько бронирует их за собой.
  # Не довёл (сосед недоступен) — запись вернётся в работу, когда истечёт бронь; повтор безопасен: ключ идемпотентности тот же
  batch-size: 50
  parallelism: 8
  claim-for: 2m
  # Минимум суммы автоплатежа, пополнения и лимита в месяц, ₽
  min-amount: 10
  # «Каждые N дней» — не больше; первый платёж — не дальше чем через
  max-period-days: 180
  max-start-ahead: P1Y
  # Длина названий — по колонкам таблиц (autopayments.name, topups.name, templates.name)
  name-max: 60
  template-name-max: 40
  # Сколько последних запусков показываем в карточке
  runs-shown: 20
  topup:
    # Пауза до следующей проверки баланса: после пополнения — дать балансу обновиться, после отказа — не долбить источник
    after-success: 1m
    after-failure: 30m

# Отказоустойчивость соседей (libs/platform ResilientCalls); 4xx — ответ соседа, не сбой
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
    instances:
      account: { base-config: default }
      biller: { base-config: default }
      pricing: { base-config: default }
      payment: { base-config: default }
  # Один повтор: дальше — следующий проход планировщика
  retry:
    configs:
      default:
        max-attempts: 2
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      connect-only:
        max-attempts: 2
        wait-duration: 200ms
        retry-exception-predicate: com.paymentsapp.platform.resilience.ConnectFailure
    instances:
      account: { base-config: default }
      biller: { base-config: default }
      pricing: { base-config: default }
      payment-connect-only: { base-config: connect-only }
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 20
        max-wait-duration: 500ms
    instances:
      account: { base-config: default }
      biller: { base-config: default }
      pricing: { base-config: default }
      payment: { base-config: default }

# Общая библиотека libs/platform
platform:
  # Swagger: описание API и коды ошибок в схеме Problem
  openapi:
    description: "Шаблоны платежей, автоплатежи и автопополнения"
    error-codes: com.paymentsapp.autopayments.error.AutopaymentsError
  # День автоплатежа и месяц лимита считаем по московскому времени
  time:
    zone: Europe/Moscow

# Actuator: /actuator/health — liveness (процесс жив) и readiness (готов принимать запросы: есть БД и Redis);
# по ним healthcheck в compose и пробы Kubernetes. Остановка — плавная (по умолчанию в Spring Boot): новые запросы
# не принимаем, текущие дорабатывают
management:
  endpoints:
    web:
      exposure:
        # prometheus — метрики для Prometheus (/actuator/prometheus); куда отправлять трассы и формат логов
        # задаёт окружение (в Kubernetes — payments-deploy/envs/<окружение>/env.yaml)
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis

springdoc:
  # Swagger UI и спецификация включены; в проде можно выключить: SWAGGER_ENABLED=false
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
